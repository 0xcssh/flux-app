<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux — Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0F;
      color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .logo span { color: #3B82F6; }
    .tagline {
      color: #9CA3AF;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }
    .links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      display: block;
      padding: 1rem 2.5rem;
      background: #1A1A2E;
      color: #3B82F6;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 1px solid #2A2A3E;
      transition: background 0.2s, border-color 0.2s;
    }
    .links a:hover {
      background: #22224A;
      border-color: #3B82F6;
    }
    footer {
      margin-top: 4rem;
      color: #6B7280;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="logo">FL<span>U</span>X</div>
  <p class="tagline">Men's Hormonal Cycle Tracker</p>
  <div class="links">
    <a href="/terms">Terms of Service</a>
    <a href="/privacy">Privacy Policy</a>
  </div>
  <footer>&copy; 2026 Flux — Flux App. All rights reserved.</footer>
</body>
</html>
